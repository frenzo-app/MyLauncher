<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XOS 16 Launcher</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root {
            --xos-accent: #00e676;
            --xos-glass: rgba(22, 26, 35, 0.56);
            --xos-border: rgba(255, 255, 255, 0.18);
            --text-main: #ffffff;
            --text-muted: #cbd5e1;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background: transparent;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: linear-gradient(180deg, rgba(0,0,0,0.22) 0%, rgba(0,0,0,0.04) 48%, rgba(0,0,0,0.34) 100%);
            pointer-events: none;
            z-index: 0;
        }

        /* Clock Lower & Larger */
        .xos-clock-section {
            padding: 54px 22px 12px 22px;
            z-index: 5;
        }

        .clock-box h1 {
            font-size: 68px;
            font-weight: 800;
            line-height: 1;
            letter-spacing: -2.5px;
            background: linear-gradient(to bottom, #ffffff, #e2e8f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 3px 10px rgba(0,0,0,0.45));
        }

        .clock-box .accent-dot {
            color: var(--xos-accent);
            -webkit-text-fill-color: var(--xos-accent);
        }

        .clock-box p {
            font-size: 14px;
            color: #f8fafc;
            margin-top: 7px;
            font-weight: 600;
            text-shadow: 0 1px 5px rgba(0,0,0,0.8);
        }

        /* Multi-Page Horizontal Home Screen Container */
        .pages-viewport {
            flex: 1;
            width: 100vw;
            overflow: hidden;
            position: relative;
            z-index: 5;
        }

        .pages-track {
            display: flex;
            width: 300vw;
            height: 100%;
            transition: transform 0.34s cubic-bezier(0.22, 1, 0.36, 1);
            transform: translate3d(0, 0, 0);
            will-change: transform;
        }

        .home-page {
            width: 100vw;
            height: 100%;
            padding: 8px 12px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-auto-rows: min-content;
            gap: 16px 6px;
            align-content: start;
        }

        /* App Icon Size Set to 85 (on a 100 scale) */
        .app-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            touch-action: pan-x pan-y;
        }

        .app-item:active {
            transform: scale(0.9);
        }

        .app-item.dragging {
            transform: scale(1.12);
            z-index: 90;
            opacity: 0.94;
            filter: drop-shadow(0 12px 20px rgba(0,0,0,0.6));
        }

        .app-icon {
            width: 85px;
            height: 85px;
            max-width: 22vw;
            max-height: 22vw;
            border-radius: 22px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 36px;
            color: white;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.32);
            overflow: hidden;
            position: relative;
        }

        .app-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        .app-name {
            font-size: 12px;
            font-weight: 500;
            text-align: center;
            max-width: 88px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 1px 4px rgba(0,0,0,0.88);
            pointer-events: none;
        }

        /* Page Indicator Dots */
        .page-dots {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 7px;
            padding: 8px 0 6px 0;
            z-index: 5;
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            transition: all 0.25s ease;
        }

        .dot.active {
            width: 14px;
            border-radius: 10px;
            background: #ffffff;
        }

        /* Larger Bottom Dock Box */
        .dock-wrapper {
            padding: 6px 12px 18px 12px;
            z-index: 5;
        }

        .xos-dock {
            background: var(--xos-glass);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            border: 1px solid var(--xos-border);
            border-radius: 34px;
            padding: 14px 10px;
            min-height: 106px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            align-items: center;
            gap: 6px;
        }

        .xos-dock .app-icon {
            width: 85px;
            height: 85px;
            max-width: 21vw;
            max-height: 21vw;
            border-radius: 22px;
            font-size: 36px;
        }

        .xos-dock .app-name {
            display: none;
        }

        /* Instant XOS 16 App Drawer */
        .app-drawer {
            position: fixed;
            inset: 0;
            background: rgba(14, 18, 28, 0.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 60;
            display: flex;
            flex-direction: column;
            transform: translate3d(0, 100%, 0);
            opacity: 0;
            pointer-events: none;
            transition: transform 0.24s cubic-bezier(0.2, 0.9, 0.3, 1), opacity 0.16s ease;
            padding: 46px 14px 18px 14px;
            will-change: transform, opacity;
        }

        .app-drawer.open {
            transform: translate3d(0, 0, 0);
            opacity: 1;
            pointer-events: auto;
        }

        /* Category Bar Lower & Larger Text */
        .category-bar {
            display: flex;
            gap: 22px;
            overflow-x: auto;
            padding: 12px 6px 14px 6px;
            scrollbar-width: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-top: 8px;
            margin-bottom: 12px;
        }

        .category-bar::-webkit-scrollbar {
            display: none;
        }

        .cat-tab {
            font-size: 18px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.58);
            white-space: nowrap;
            cursor: pointer;
            padding-bottom: 8px;
            position: relative;
            transition: color 0.15s ease;
        }

        .cat-tab.active {
            color: #ffffff;
        }

        .cat-tab.active::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            border-radius: 3px;
            background: var(--xos-accent);
        }

        /* Smooth Scrolling Drawer Grid */
        .drawer-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-auto-rows: min-content;
            gap: 20px 6px;
            overflow-y: auto;
            padding: 10px 2px 16px 2px;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-y: contain;
        }

        .drawer-grid::-webkit-scrollbar {
            width: 3px;
        }

        .drawer-grid::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.22);
            border-radius: 10px;
        }

        /* Bottom English Search Bar in Drawer */
        .drawer-bottom-search {
            background: rgba(255, 255, 255, 0.13);
            border: 1px solid var(--xos-border);
            border-radius: 50px;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 8px;
        }

        .drawer-bottom-search input {
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            width: 100%;
            font-size: 15px;
        }

        .drawer-bottom-search input::placeholder {
            color: rgba(255, 255, 255, 0.68);
        }

        /* Long Press 3-Option Menu */
        .context-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(6px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 115;
            padding: 20px;
        }

        .context-menu {
            background: #181e2c;
            border: 1px solid var(--xos-border);
            border-radius: 22px;
            width: 100%;
            max-width: 280px;
            padding: 10px;
            box-shadow: 0 14px 34px rgba(0,0,0,0.6);
        }

        .context-header {
            padding: 10px 14px;
            font-size: 15px;
            font-weight: 700;
            color: var(--xos-accent);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            margin-bottom: 6px;
        }

        .context-option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 13px 14px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
            cursor: pointer;
        }

        .context-option:active {
            background: rgba(255,255,255,0.1);
        }

        .context-option.danger {
            color: #f87171;
        }

        /* App Launch Zoom Layer */
        .launch-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.92);
            z-index: 150;
            pointer-events: none;
            opacity: 0;
            transform: scale(0.45);
            border-radius: 36px;
            transition: transform 0.24s cubic-bezier(0.2, 0.9, 0.3, 1), opacity 0.18s ease, border-radius 0.24s ease;
        }

        .launch-overlay.active {
            opacity: 1;
            transform: scale(1);
            border-radius: 0;
        }

        /* Icon Customizer Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.78);
            backdrop-filter: blur(10px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 125;
            padding: 20px;
        }

        .modal-card {
            background: #161b26;
            border: 1px solid var(--xos-border);
            border-radius: 26px;
            width: 100%;
            max-width: 360px;
            padding: 22px;
            color: white;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-card h3 {
            font-size: 17px;
            margin-bottom: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .form-group input[type="text"] {
            width: 100%;
            padding: 10px 12px;
            border-radius: 12px;
            border: 1px solid var(--xos-border);
            background: #0f131c;
            color: white;
            outline: none;
            font-size: 14px;
        }

        .file-upload-btn {
            display: block;
            width: 100%;
            padding: 10px;
            background: rgba(0, 230, 118, 0.15);
            border: 1px dashed var(--xos-accent);
            color: var(--xos-accent);
            text-align: center;
            border-radius: 12px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }

        .preset-icons {
            display: flex;
            gap: 8px;
            margin-top: 6px;
            flex-wrap: wrap;
        }

        .preset-icon-opt {
            width: 38px;
            height: 38px;
            border-radius: 11px;
            background: #232a3b;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 16px;
        }

        .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        .btn {
            flex: 1;
            padding: 11px;
            border-radius: 14px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-save { background: var(--xos-accent); color: #000; }
        .btn-cancel { background: #283042; color: white; }
        .btn-reset { background: rgba(239, 68, 68, 0.2); color: #f87171; margin-top: 8px; width: 100%; }

        .toast {
            position: fixed;
            bottom: 125px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.92);
            color: var(--xos-accent);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 13px;
            display: none;
            z-index: 200;
            border: 1px solid var(--xos-border);
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <!-- Lower & Larger Clock -->
    <div class="xos-clock-section">
        <div class="clock-box">
            <h1 id="main-clock">12<span class="accent-dot">:</span>00</h1>
            <p id="main-date">Tuesday, November 24</p>
        </div>
    </div>

    <!-- Multi-Page Horizontal Home Screen -->
    <div class="pages-viewport" id="pages-viewport">
        <div class="pages-track" id="pages-track">
            <div class="home-page" data-page="0" id="page-0"></div>
            <div class="home-page" data-page="1" id="page-1"></div>
            <div class="home-page" data-page="2" id="page-2"></div>
        </div>
    </div>

    <!-- Page Indicator Dots -->
    <div class="page-dots" id="page-dots">
        <span class="dot active" onclick="goToPage(0)"></span>
        <span class="dot" onclick="goToPage(1)"></span>
        <span class="dot" onclick="goToPage(2)"></span>
    </div>

    <!-- Larger Bottom Dock -->
    <div class="dock-wrapper">
        <div class="xos-dock" id="dock-grid"></div>
    </div>

    <!-- Instant XOS 16 App Drawer -->
    <div class="app-drawer" id="app-drawer">
        <div class="category-bar" id="category-bar">
            <div class="cat-tab active" onclick="selectCategory('All', this)">All</div>
            <div class="cat-tab" onclick="selectCategory('Communication', this)">Communication</div>
            <div class="cat-tab" onclick="selectCategory('Entertainment', this)">Entertainment</div>
            <div class="cat-tab" onclick="selectCategory('Social', this)">Social</div>
            <div class="cat-tab" onclick="selectCategory('Games', this)">Games</div>
            <div class="cat-tab" onclick="selectCategory('Tools', this)">Tools</div>
        </div>

        <div class="drawer-grid" id="drawer-grid"></div>

        <div class="drawer-bottom-search">
            <i class="fa-solid fa-magnifying-glass" style="color: rgba(255,255,255,0.75);"></i>
            <input type="text" id="drawer-search-input" placeholder="Search for apps" oninput="filterDrawerApps()">
        </div>
    </div>

    <!-- Long Press 3-Option Context Menu -->
    <div class="context-overlay" id="context-overlay" onclick="closeContextMenu(event)">
        <div class="context-menu" onclick="event.stopPropagation()">
            <div class="context-header" id="context-app-title">App Options</div>
            <div class="context-option" onclick="triggerAppInfo()">
                <i class="fa-solid fa-circle-info" style="color:#38bdf8; width:18px;"></i>
                <span>App info</span>
            </div>
            <div class="context-option danger" onclick="triggerUninstall()">
                <i class="fa-solid fa-trash-can" style="width:18px;"></i>
                <span>Uninstall</span>
            </div>
            <div class="context-option" onclick="triggerIconChange()">
                <i class="fa-solid fa-wand-magic-sparkles" style="color:var(--xos-accent); width:18px;"></i>
                <span>Icon change</span>
            </div>
        </div>
    </div>

    <!-- App Launch Zoom Layer -->
    <div class="launch-overlay" id="launch-overlay"></div>

    <!-- Icon Customizer Modal -->
    <div class="modal-overlay" id="icon-modal">
        <div class="modal-card">
            <h3>
                <span>Customize Icon</span>
                <i class="fa-solid fa-xmark" onclick="closeModal()" style="cursor:pointer; color:var(--text-muted);"></i>
            </h3>

            <div class="form-group">
                <label>App Name</label>
                <input type="text" id="edit-name" placeholder="Enter app name">
            </div>

            <div class="form-group">
                <label>Move to Page / Dock</label>
                <div class="preset-icons">
                    <div class="preset-icon-opt" style="width:auto; padding:0 12px; font-size:12px;" onclick="assignLocation('home', 0)">Page 1</div>
                    <div class="preset-icon-opt" style="width:auto; padding:0 12px; font-size:12px;" onclick="assignLocation('home', 1)">Page 2</div>
                    <div class="preset-icon-opt" style="width:auto; padding:0 12px; font-size:12px;" onclick="assignLocation('home', 2)">Page 3</div>
                    <div class="preset-icon-opt" style="width:auto; padding:0 12px; font-size:12px;" onclick="assignLocation('dock', 0)">Dock</div>
                </div>
            </div>

            <div class="form-group">
                <label>Upload Icon Image from Gallery</label>
                <label class="file-upload-btn">
                    <i class="fa-solid fa-upload"></i> Choose Image (PNG/JPG)
                    <input type="file" id="edit-image-file" accept="image/*" style="display:none;" onchange="handleImageUpload(event)">
                </label>
            </div>

            <div class="form-group">
                <label>Or Select XOS Preset Icon</label>
                <div class="preset-icons">
                    <div class="preset-icon-opt" onclick="selectPreset('fa-brands fa-youtube', 'linear-gradient(135deg, #ff0000, #b91c1c)')"><i class="fa-brands fa-youtube"></i></div>
                    <div class="preset-icon-opt" onclick="selectPreset('fa-brands fa-facebook-f', 'linear-gradient(135deg, #1877f2, #1d4ed8)')"><i class="fa-brands fa-facebook-f"></i></div>
                    <div class="preset-icon-opt" onclick="selectPreset('fa-brands fa-whatsapp', 'linear-gradient(135deg, #25d366, #15803d)')"><i class="fa-brands fa-whatsapp"></i></div>
                    <div class="preset-icon-opt" onclick="selectPreset('fa-brands fa-instagram', 'linear-gradient(135deg, #f59e0b, #db2777)')"><i class="fa-brands fa-instagram"></i></div>
                    <div class="preset-icon-opt" onclick="selectPreset('fa-solid fa-gamepad', 'linear-gradient(135deg, #f97316, #ea580c)')"><i class="fa-solid fa-gamepad"></i></div>
                    <div class="preset-icon-opt" onclick="selectPreset('fa-solid fa-camera', 'linear-gradient(135deg, #f59e0b, #b45309)')"><i class="fa-solid fa-camera"></i></div>
                    <div class="preset-icon-opt" onclick="selectPreset('fa-solid fa-music', 'linear-gradient(135deg, #8b5cf6, #5b21b6)')"><i class="fa-solid fa-music"></i></div>
                    <div class="preset-icon-opt" onclick="selectPreset('fa-solid fa-globe', 'linear-gradient(135deg, #3b82f6, #1d4ed8)')"><i class="fa-solid fa-globe"></i></div>
                </div>
            </div>

            <div class="btn-row">
                <button class="btn btn-cancel" onclick="closeModal()">Cancel</button>
                <button class="btn btn-save" onclick="saveAppChanges()">Save</button>
            </div>
            <button class="btn btn-reset" onclick="resetToSystemIcon()">Reset to System Icon</button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const htmlStylizedApps = [
            { id: "youtube", name: "YouTube", url: "https://m.youtube.com", iconClass: "fa-brands fa-youtube", bg: "linear-gradient(135deg, #ff0000, #b91c1c)", customImg: "", location: "home", page: 0, category: "Entertainment", order: 1 },
            { id: "facebook", name: "Facebook", url: "https://m.facebook.com", iconClass: "fa-brands fa-facebook-f", bg: "linear-gradient(135deg, #1877f2, #1d4ed8)", customImg: "", location: "home", page: 0, category: "Social", order: 2 },
            { id: "xtheme", name: "XTheme", url: "#", iconClass: "fa-solid fa-wand-magic-sparkles", bg: "linear-gradient(135deg, #00e676, #059669)", customImg: "", location: "home", page: 0, action: "edit", category: "Tools", order: 3 },
            { id: "gamespace", name: "Game Space", url: "https://poki.com", iconClass: "fa-solid fa-gamepad", bg: "linear-gradient(135deg, #f97316, #ea580c)", customImg: "", location: "home", page: 0, category: "Games", order: 4 },
            { id: "instagram", name: "Instagram", url: "https://instagram.com", iconClass: "fa-brands fa-instagram", bg: "linear-gradient(135deg, #f59e0b, #db2777, #7c3aed)", customImg: "", location: "home", page: 0, category: "Social", order: 5 },
            { id: "whatsapp", name: "WhatsApp", url: "https://web.whatsapp.com", iconClass: "fa-brands fa-whatsapp", bg: "linear-gradient(135deg, #25d366, #15803d)", customImg: "", location: "home", page: 0, category: "Communication", order: 6 },
            { id: "github", name: "GitHub", url: "https://github.com", iconClass: "fa-brands fa-github", bg: "linear-gradient(135deg, #334155, #0f172a)", customImg: "", location: "home", page: 0, category: "Tools", order: 7 },
            { id: "allapps", name: "All Apps", url: "#", iconClass: "fa-solid fa-grip", bg: "linear-gradient(135deg, #00e676, #0284c7)", customImg: "", location: "home", page: 0, action: "drawer", category: "Tools", order: 8 },

            { id: "dock_phone", name: "Phone", url: "tel:", iconClass: "fa-solid fa-phone", bg: "linear-gradient(135deg, #00e676, #047857)", customImg: "", location: "dock", page: 0, category: "Communication", order: 1 },
            { id: "dock_msg", name: "Messages", url: "sms:", iconClass: "fa-solid fa-comment-dots", bg: "linear-gradient(135deg, #38bdf8, #0284c7)", customImg: "", location: "dock", page: 0, category: "Communication", order: 2 },
            { id: "dock_chrome", name: "Chrome", url: "https://google.com", iconClass: "fa-brands fa-chrome", bg: "linear-gradient(135deg, #facc15, #ef4444)", customImg: "", location: "dock", page: 0, category: "Tools", order: 3 },
            { id: "dock_cam", name: "Camera", url: "#", iconClass: "fa-solid fa-camera", bg: "linear-gradient(135deg, #64748b, #1e293b)", customImg: "", location: "dock", page: 0, category: "Tools", order: 4 }
        ];

        let savedMeta = JSON.parse(localStorage.getItem('xos16_app_meta')) || {};
        let apps = [];
        let currentPage = 0;
        let currentCategory = "All";
        let currentEditingId = null;
        let selectedContextApp = null;
        let drawerBuiltOnce = false;
        let isAnyAppDragging = false;

        let tempCustomImg = "";
        let tempIconClass = "";
        let tempBg = "";
        let tempLocation = "home";
        let tempPage = 0;

        function refreshInstalledApps() {
            let systemApps = [];
            if (window.AndroidBridge && typeof AndroidBridge.getInstalledApps === 'function') {
                try {
                    const raw = JSON.parse(AndroidBridge.getInstalledApps());
                    systemApps = raw.map((item, idx) => ({
                        id: item.packageName,
                        packageName: item.packageName,
                        name: item.name,
                        systemIcon: item.systemIcon,
                        customImg: "",
                        iconClass: "",
                        bg: "transparent",
                        location: idx < 16 ? "home" : "drawer",
                        page: idx < 8 ? 1 : 2,
                        category: item.category || "Tools",
                        order: 100 + idx
                    }));
                } catch (e) {}
            }

            const mergedMap = new Map();
            htmlStylizedApps.forEach(a => mergedMap.set(a.id, { ...a }));

            systemApps.forEach(sys => {
                const lower = sys.packageName.toLowerCase();
                if (lower.includes("youtube") && !lower.includes("music")) {
                    mergedMap.get("youtube").packageName = sys.packageName;
                    mergedMap.get("youtube").systemIcon = sys.systemIcon;
                } else if (lower.includes("facebook.katana")) {
                    mergedMap.get("facebook").packageName = sys.packageName;
                    mergedMap.get("facebook").systemIcon = sys.systemIcon;
                } else if (lower.includes("instagram")) {
                    mergedMap.get("instagram").packageName = sys.packageName;
                    mergedMap.get("instagram").systemIcon = sys.systemIcon;
                } else if (lower.includes("whatsapp")) {
                    mergedMap.get("whatsapp").packageName = sys.packageName;
                    mergedMap.get("whatsapp").systemIcon = sys.systemIcon;
                } else if (lower.includes("dialer") || lower.includes("contacts")) {
                    if (!mergedMap.get("dock_phone").packageName) mergedMap.get("dock_phone").packageName = sys.packageName;
                    mergedMap.set(sys.id, sys);
                } else if (lower.includes("mms") || lower.includes("messaging")) {
                    if (!mergedMap.get("dock_msg").packageName) mergedMap.get("dock_msg").packageName = sys.packageName;
                    mergedMap.set(sys.id, sys);
                } else if (lower.includes("chrome")) {
                    mergedMap.get("dock_chrome").packageName = sys.packageName;
                } else if (lower.includes("camera")) {
                    mergedMap.get("dock_cam").packageName = sys.packageName;
                } else {
                    mergedMap.set(sys.id, sys);
                }
            });

            apps = Array.from(mergedMap.values()).map(app => {
                if (savedMeta[app.id]) return { ...app, ...savedMeta[app.id] };
                return app;
            });

            drawerBuiltOnce = false;
            renderAll();
        }

        function createAppElement(app, context) {
            const appEl = document.createElement('div');
            appEl.className = 'app-item';
            appEl.dataset.id = app.id;
            appEl.dataset.category = app.category || 'Tools';
            appEl.dataset.name = (app.name || '').toLowerCase();

            let iconHtml = '';
            let iconBg = app.bg || 'transparent';

            if (app.customImg) {
                iconHtml = `<img src="${app.customImg}" alt="${app.name}">`;
                iconBg = 'transparent';
            } else if (app.iconClass) {
                iconHtml = `<i class="${app.iconClass}"></i>`;
            } else if (app.systemIcon) {
                iconHtml = `<img src="${app.systemIcon}" alt="${app.name}">`;
                iconBg = 'transparent';
            } else {
                iconHtml = `<i class="fa-solid fa-cube"></i>`;
                iconBg = 'linear-gradient(135deg, #00e676, #0284c7)';
            }

            appEl.innerHTML = `
                <div class="app-icon" style="background: ${iconBg};">
                    ${iconHtml}
                </div>
                <span class="app-name">${app.name}</span>
            `;

            setupLongPressAndDrag(appEl, app, context);
            return appEl;
        }

        function setupLongPressAndDrag(el, app, context) {
            let pressTimer = null;
            let isDragging = false;
            let startX = 0, startY = 0;
            let edgeCooldown = false;

            el.addEventListener('touchstart', (e) => {
                if (e.touches.length > 1) return;
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
                edgeCooldown = false;

                pressTimer = setTimeout(() => {
                    isDragging = true;
                    isAnyAppDragging = true;
                    el.classList.add('dragging');
                    if (navigator.vibrate) navigator.vibrate(40);
                }, 650);
            }, { passive: true });

            el.addEventListener('touchmove', (e) => {
                const curX = e.touches[0].clientX;
                const curY = e.touches[0].clientY;
                const dx = curX - startX;
                const dy = curY - startY;

                if (!isDragging && (Math.abs(dx) > 12 || Math.abs(dy) > 12)) {
                    clearTimeout(pressTimer);
                    return;
                }

                if (isDragging) {
                    e.preventDefault();
                    e.stopPropagation();
                    el.style.transform = `translate3d(${dx}px, ${dy}px, 0) scale(1.12)`;

                    // Move app across home screen pages when dragged near left/right edge
                    if (context === 'home' && !edgeCooldown) {
                        if (curX >= window.innerWidth - 36 && currentPage < 2) {
                            edgeCooldown = true;
                            const nextPage = currentPage + 1;
                            app.page = nextPage;
                            app.location = 'home';
                            goToPage(nextPage);
                            startX = curX - 80;
                            showToast(`Moved to Page ${nextPage + 1}`);
                            setTimeout(() => { edgeCooldown = false; }, 550);
                        } else if (curX <= 36 && currentPage > 0) {
                            edgeCooldown = true;
                            const prevPage = currentPage - 1;
                            app.page = prevPage;
                            app.location = 'home';
                            goToPage(prevPage);
                            startX = curX + 80;
                            showToast(`Moved to Page ${prevPage + 1}`);
                            setTimeout(() => { edgeCooldown = false; }, 550);
                        }
                    }
                }
            }, { passive: false });

            el.addEventListener('touchend', (e) => {
                clearTimeout(pressTimer);

                if (isDragging) {
                    isDragging = false;
                    isAnyAppDragging = false;
                    el.classList.remove('dragging');
                    el.style.transform = '';

                    const endTouch = e.changedTouches[0];
                    if (Math.abs(endTouch.clientX - startX) < 16 && Math.abs(endTouch.clientY - startY) < 16) {
                        openContextMenu(app);
                        return;
                    }

                    el.style.visibility = 'hidden';
                    const targetEl = document.elementFromPoint(endTouch.clientX, endTouch.clientY)?.closest('.app-item');
                    el.style.visibility = 'visible';

                    if (targetEl && targetEl.dataset.id !== app.id) {
                        const targetApp = apps.find(a => a.id === targetEl.dataset.id);
                        if (targetApp) {
                            const tempOrder = app.order;
                            app.order = targetApp.order;
                            targetApp.order = tempOrder;
                            app.location = targetApp.location;
                            app.page = targetApp.page;
                            saveMetaForApp(targetApp);
                        }
                    } else if (context === 'drawer') {
                        app.location = 'home';
                        app.page = currentPage;
                        toggleDrawer(false);
                        showToast(`${app.name} added to Page ${currentPage + 1}`);
                    } else if (context === 'home') {
                        app.location = 'home';
                        app.page = currentPage;
                    }

                    saveMetaForApp(app);
                    drawerBuiltOnce = false;
                    renderAll();
                    goToPage(currentPage);
                } else {
                    const dx = Math.abs(e.changedTouches[0].clientX - startX);
                    const dy = Math.abs(e.changedTouches[0].clientY - startY);
                    if (dx < 10 && dy < 10) {
                        handleAppClick(app, el);
                    }
                }
            });
        }

        /* Long Press 3-Option Menu Handlers */
        function openContextMenu(app) {
            selectedContextApp = app;
            document.getElementById('context-app-title').innerText = app.name;
            document.getElementById('context-overlay').style.display = 'flex';
        }

        function closeContextMenu(e) {
            if (!e || e.target.id === 'context-overlay') {
                document.getElementById('context-overlay').style.display = 'none';
            }
        }

        function triggerAppInfo() {
            closeContextMenu();
            if (!selectedContextApp) return;
            if (selectedContextApp.packageName && window.AndroidBridge && typeof AndroidBridge.openAppInfo === 'function') {
                AndroidBridge.openAppInfo(selectedContextApp.packageName);
            } else {
                showToast("App Info not available");
            }
        }

        function triggerUninstall() {
            closeContextMenu();
            if (!selectedContextApp) return;
            if (selectedContextApp.packageName && window.AndroidBridge && typeof AndroidBridge.uninstallApp === 'function') {
                AndroidBridge.uninstallApp(selectedContextApp.packageName);
            } else {
                showToast("Cannot uninstall this item");
            }
        }

        function triggerIconChange() {
            closeContextMenu();
            if (selectedContextApp) {
                openEditModal(selectedContextApp);
            }
        }

        function handleAppClick(app, el) {
            if (app.action === 'edit') {
                openEditModal(app);
                return;
            }
            if (app.action === 'drawer') {
                toggleDrawer(true);
                return;
            }

            const rect = el.querySelector('.app-icon').getBoundingClientRect();
            const overlay = document.getElementById('launch-overlay');
            overlay.style.transformOrigin = `${rect.left + rect.width / 2}px ${rect.top + rect.height / 2}px`;
            overlay.classList.add('active');

            setTimeout(() => {
                if (app.packageName && window.AndroidBridge) {
                    AndroidBridge.launchApp(
                        app.packageName,
                        Math.round(rect.left),
                        Math.round(rect.top),
                        Math.round(rect.width),
                        Math.round(rect.height)
                    );
                } else if (app.url && app.url !== '#') {
                    window.location.href = app.url;
                } else {
                    showToast(`Opening ${app.name}...`);
                }

                setTimeout(() => {
                    overlay.classList.remove('active');
                }, 260);
            }, 90);
        }

        function renderAll() {
            const pages = [
                document.getElementById('page-0'),
                document.getElementById('page-1'),
                document.getElementById('page-2')
            ];
            const dock = document.getElementById('dock-grid');

            const frag0 = document.createDocumentFragment();
            const frag1 = document.createDocumentFragment();
            const frag2 = document.createDocumentFragment();
            const fragDock = document.createDocumentFragment();

            const sortedByOrder = [...apps].sort((a, b) => (a.order || 0) - (b.order || 0));

            sortedByOrder.forEach(app => {
                if (app.location === 'home') {
                    const pIdx = Math.min(Math.max(app.page || 0, 0), 2);
                    const el = createAppElement(app, 'home');
                    if (pIdx === 0) frag0.appendChild(el);
                    else if (pIdx === 1) frag1.appendChild(el);
                    else frag2.appendChild(el);
                } else if (app.location === 'dock') {
                    fragDock.appendChild(createAppElement(app, 'dock'));
                }
            });

            pages[0].innerHTML = '';
            pages[1].innerHTML = '';
            pages[2].innerHTML = '';
            dock.innerHTML = '';

            pages[0].appendChild(frag0);
            pages[1].appendChild(frag1);
            pages[2].appendChild(frag2);
            dock.appendChild(fragDock);

            buildDrawerOnce();
        }

        function buildDrawerOnce() {
            if (drawerBuiltOnce) {
                filterDrawerApps();
                return;
            }
            const drawerGrid = document.getElementById('drawer-grid');
            const frag = document.createDocumentFragment();

            const sortedAlpha = [...apps]
                .filter(a => a.action !== 'drawer')
                .sort((a, b) => a.name.localeCompare(b.name));

            sortedAlpha.forEach(app => {
                frag.appendChild(createAppElement(app, 'drawer'));
            });

            drawerGrid.innerHTML = '';
            drawerGrid.appendChild(frag);
            drawerBuiltOnce = true;
            filterDrawerApps();
        }

        function selectCategory(cat, tabEl) {
            currentCategory = cat;
            document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
            tabEl.classList.add('active');
            filterDrawerApps();
        }

        function filterDrawerApps() {
            const query = document.getElementById('drawer-search-input').value.trim().toLowerCase();
            const items = document.querySelectorAll('#drawer-grid .app-item');
            items.forEach(item => {
                const matchCat = currentCategory === 'All' || item.dataset.category === currentCategory;
                const matchSearch = !query || item.dataset.name.includes(query);
                item.style.display = (matchCat && matchSearch) ? 'flex' : 'none';
            });
        }

        /* Swipe Navigation */
        const viewport = document.getElementById('pages-viewport');
        const track = document.getElementById('pages-track');
        let swipeStartX = 0, swipeStartY = 0, isHorizontalSwipe = false;

        viewport.addEventListener('touchstart', (e) => {
            if (isAnyAppDragging) return;
            swipeStartX = e.touches[0].clientX;
            swipeStartY = e.touches[0].clientY;
            isHorizontalSwipe = false;
            track.style.transition = 'none';
        }, { passive: true });

        viewport.addEventListener('touchmove', (e) => {
            if (isAnyAppDragging || document.querySelector('.app-item.dragging')) return;
            const dx = e.touches[0].clientX - swipeStartX;
            const dy = e.touches[0].clientY - swipeStartY;

            if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 10) {
                isHorizontalSwipe = true;
                const baseOffset = -currentPage * window.innerWidth;
                track.style.transform = `translate3d(${baseOffset + dx}px, 0, 0)`;
            }
        }, { passive: true });

        viewport.addEventListener('touchend', (e) => {
            track.style.transition = 'transform 0.34s cubic-bezier(0.22, 1, 0.36, 1)';
            if (isAnyAppDragging) return;

            const dx = e.changedTouches[0].clientX - swipeStartX;
            const dy = e.changedTouches[0].clientY - swipeStartY;

            if (isHorizontalSwipe) {
                if (dx < -55 && currentPage < 2) goToPage(currentPage + 1);
                else if (dx > 55 && currentPage > 0) goToPage(currentPage - 1);
                else goToPage(currentPage);
            } else if (dy < -55 && Math.abs(dx) < 55) {
                toggleDrawer(true);
            }
        }, { passive: true });

        function goToPage(pageIdx) {
            currentPage = pageIdx;
            track.style.transform = `translate3d(-${currentPage * 100}vw, 0, 0)`;
            document.querySelectorAll('.dot').forEach((d, idx) => {
                d.classList.toggle('active', idx === currentPage);
            });
        }

        function toggleDrawer(open) {
            const drawer = document.getElementById('app-drawer');
            if (open) {
                drawer.classList.add('open');
            } else {
                drawer.classList.remove('open');
                document.getElementById('drawer-search-input').value = '';
                filterDrawerApps();
            }
        }

        let drawerTouchY = 0;
        const appDrawerEl = document.getElementById('app-drawer');
        appDrawerEl.addEventListener('touchstart', e => {
            drawerTouchY = e.touches[0].clientY;
        }, { passive: true });

        appDrawerEl.addEventListener('touchend', e => {
            const diffY = e.changedTouches[0].clientY - drawerTouchY;
            if (diffY > 80 && document.getElementById('drawer-grid').scrollTop <= 0) {
                toggleDrawer(false);
            }
        }, { passive: true });

        function onAndroidBack() {
            if (document.getElementById('icon-modal').style.display === 'flex') {
                closeModal();
            } else if (document.getElementById('context-overlay').style.display === 'flex') {
                closeContextMenu();
            } else if (document.getElementById('app-drawer').classList.contains('open')) {
                toggleDrawer(false);
            } else if (currentPage !== 0) {
                goToPage(0);
            }
        }

        /* Icon Customizer */
        function openEditModal(app) {
            currentEditingId = app.id;
            tempCustomImg = app.customImg || "";
            tempIconClass = app.iconClass || "";
            tempBg = app.bg || "transparent";
            tempLocation = app.location || "home";
            tempPage = app.page || 0;

            document.getElementById('edit-name').value = app.name;
            document.getElementById('icon-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('icon-modal').style.display = 'none';
        }

        function assignLocation(loc, page) {
            tempLocation = loc;
            tempPage = page;
            showToast(loc === 'dock' ? "Dock selected" : `Page ${page + 1} selected`);
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    canvas.width = 160;
                    canvas.height = 160;
                    canvas.getContext('2d').drawImage(img, 0, 0, 160, 160);
                    tempCustomImg = canvas.toDataURL('image/png');
                    tempIconClass = "";
                    showToast("New icon image selected!");
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function selectPreset(iconClass, bg) {
            tempCustomImg = "";
            tempIconClass = iconClass;
            tempBg = bg;
            showToast("XOS preset icon selected");
        }

        function saveAppChanges() {
            const newName = document.getElementById('edit-name').value.trim();
            apps = apps.map(app => {
                if (app.id === currentEditingId) {
                    const updated = {
                        ...app,
                        name: newName || app.name,
                        customImg: tempCustomImg,
                        iconClass: tempIconClass,
                        bg: tempBg,
                        location: tempLocation,
                        page: tempPage
                    };
                    saveMetaForApp(updated);
                    return updated;
                }
                return app;
            });

            drawerBuiltOnce = false;
            renderAll();
            closeModal();
            showToast("Saved!");
        }

        function resetToSystemIcon() {
            apps = apps.map(app => {
                if (app.id === currentEditingId) {
                    const updated = {
                        ...app,
                        customImg: "",
                        iconClass: "",
                        bg: "transparent"
                    };
                    saveMetaForApp(updated);
                    return updated;
                }
                return app;
            });
            drawerBuiltOnce = false;
            renderAll();
            closeModal();
            showToast("Reset to system icon");
        }

        function saveMetaForApp(app) {
            savedMeta[app.id] = {
                name: app.name,
                customImg: app.customImg,
                iconClass: app.iconClass,
                bg: app.bg,
                location: app.location,
                page: app.page,
                order: app.order
            };
            localStorage.setItem('xos16_app_meta', JSON.stringify(savedMeta));
        }

        function updateClock() {
            const now = new Date();
            let hours = now.getHours() % 12 || 12;
            let minutes = now.getMinutes();
            minutes = minutes < 10 ? '0' + minutes : minutes;
            document.getElementById('main-clock').innerHTML = `${hours}<span class="accent-dot">:</span>${minutes}`;
            document.getElementById('main-date').innerText = now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.display = 'block';
            setTimeout(() => { t.style.display = 'none'; }, 2000);
        }

        setInterval(updateClock, 1000);
        updateClock();
        refreshInstalledApps();
    </script>
</body>
</html>
